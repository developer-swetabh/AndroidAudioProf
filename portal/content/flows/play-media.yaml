  - n: 13
    id: kernel
    title: "Kernel ALSA, ASoC and DMA"
    short: "ALSA ring + DMA"
    process: [kernel]
    thread: "syscall context of the writer, then DMA and the period IRQ"
    path: data
    lane: kernel
    text:
      beginner: "The kernel copies the samples into a ring that the hardware reads on its own clock."
      intermediate: "The write ioctl copies frames into the **DMA ring** (period size × periods). ASoC (DPCM) connects the front-end PCM to the back-end DAI. The DMA engine streams periods to I2S/TDM, and each period-elapsed interrupt advances `hw_ptr`."
      internals: "If the ring runs dry before the next write, the PCM goes to **XRUN** and the next write fails with `-EPIPE`. A PCM can be `RUNNING` with `hw_ptr` moving while playing zeros: that is not an XRUN."
    see:
      - "`/proc/asound/card*/pcm*p/sub0/status`: `state: RUNNING`, `hw_ptr` advancing between reads."
      - "`/proc/asound/card*/pcm*p/sub0/hw_params`: period size and buffer size."
    fails:
      - "`hw_ptr` frozen while RUNNING: clocks, DAI or DMA, not Policy."
      - "Repeated XRUN: the writer above is late (step 11) or the period is too small."
    deeper:
      classes: ["ALSA PCM core", "ASoC DPCM", "generic dmaengine PCM"]
      note: "Kernel links point at the `android15-6.6` common kernel branch, which moves. Vendor kernels differ."
      sources:
        - { repo: kernel/common, path: sound/core/pcm_native.c, label: "pcm_native.c (ioctls, state machine)" }
        - { repo: kernel/common, path: sound/core/pcm_lib.c, label: "pcm_lib.c (period elapsed, hw_ptr, XRUN)" }
        - { repo: kernel/common, path: sound/soc/soc-pcm.c, label: "soc-pcm.c (ASoC / DPCM)" }
        - { repo: kernel/common, path: sound/soc/soc-generic-dmaengine-pcm.c, label: "soc-generic-dmaengine-pcm.c (DMA)" }
    links: { module: "02a#sec-step-7-kernel-alsa-pcm-ring-buffer" }

