    text:
      beginner: "The vendor code writes the samples to the Linux sound driver."
      intermediate: "AOSP default HAL: `StreamAlsa::transfer()` → `proxy_write_with_retries()` → `pcm_write()` → `ioctl(SNDRV_PCM_IOCTL_WRITEI_FRAMES)`."
      internals: "The PCM was opened in `StreamAlsa::start()` (on `Command.start`), and `StreamAlsa::standby()` closes it. Closing the PCM on standby is a **HAL choice**, not an AudioFlinger rule. Qualcomm-style HALs go through PAL → AGM → DSP instead (vendor code: do not guess module IDs)."
    see:
      - "`adb shell cat /proc/asound/card*/pcm*p/sub0/status`: `state: RUNNING` while playing."
    fails:
      - "`pcm_open` fails (wrong card/device, unsupported config): the HAL returns an error to `Command.start`."
      - "The write ioctl fails with `EPIPE` (XRUN); TinyALSA re-prepares and retries unless the PCM was opened with `PCM_NORESTART`."
    deeper:
      classes: ["StreamAlsa (AOSP default HAL)", "alsa_device_proxy", "tinyalsa pcm"]
      note: "Vendor HALs replace this whole step with their own backend."
