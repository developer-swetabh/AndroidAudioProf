        - { repo: hardware/interfaces, path: audio/aidl/android/hardware/audio/core/IStreamOut.aidl }
        - { repo: hardware/interfaces, path: audio/aidl/default/Stream.cpp, symbol: "const std::string StreamOutWorkerLogic::kThreadName = \"writer\";", before: 0, after: 4, label: "worker thread name + cycle()" }
        - { repo: hardware/interfaces, path: audio/aidl/default/Stream.cpp, symbol: "bool StreamOutWorkerLogic::write(size_t clientSize", before: 0, after: 27, label: "write(): drain the FMQ, driver transfer()" }
